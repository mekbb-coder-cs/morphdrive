services:
  postgres:
    image: postgres:16-alpine
    container_name: morphdrive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: morphdrive
      POSTGRES_PASSWORD: morphdrive_secret
      POSTGRES_DB: morphdrive
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U morphdrive -d morphdrive"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional local S3-compatible asset emulator for local development
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: morphdrive-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
